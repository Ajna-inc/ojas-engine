# Step 1: recipe only, warm-started from IISc's RT-DETRv2-S.
# Arm "st": UVH-26 train labelled by ST (the split the benchmark uses).
# Same data, same weights, same schedule as the other arm; only the label convention differs.
__include__: [
  '../runtime.yml',
  '../rtdetrv2/include/dataloader.yml',
  '../rtdetrv2/include/rtdetrv2_r50vd.yml',
]
task: detection
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']
num_classes: 15            # UVH ids 1..14; the IISc checkpoint's heads are 15 wide
remap_mscoco_category: False
output_dir: /data/dev-cache/train/out/step1_recipe_s_st

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: False        # weights come from --tuning, not an ImageNet download
HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5
RTDETRTransformerv2:
  num_layers: 3

epoches: 12
clip_max_norm: 0.1
use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    - params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
lr_scheduler:              # stepped once per epoch after warm-up: a real decay, which the released recipe never has
  type: CosineAnnealingLR
  T_max: 12
  eta_min: 0.000002
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

train_dataloader:
  type: DataLoader
  shuffle: True
  drop_last: True
  dataset:
    type: CocoDetection
    return_masks: False
    img_folder: /data/dev-cache/train/data/images/
    ann_file: /data/dev-cache/train/data/annotations/uvh_train_st.json
    transforms:
      type: Compose
      policy:
        name: stop_epoch
        epoch: 10          # heavy augmentations off for the last two epochs
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    scales: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]   # multi-scale on (off for r18 in the released recipe)
    stop_epoch: 10
  total_batch_size: 16
  num_workers: 8
val_dataloader:
  type: DataLoader
  shuffle: False
  drop_last: False
  dataset:
    type: CocoDetection
    return_masks: False
    transforms:
      type: Compose
    img_folder: /data/dev-cache/train/data/images/
    ann_file: /data/dev-cache/train/data/annotations/uvh_val_st.json
  total_batch_size: 32
  num_workers: 4
  collate_fn:
    type: BatchImageCollateFunction
