[package]
name = "ojas-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
anyhow = "1"
half = "2"
# PNG/JPEG decoding only — the resize itself is our port of llama.cpp's
# Pillow-compatible resampler (src/vit_preprocess.rs), not image's filters.
image = { workspace = true }
ojas-core = { path = "../ojas-core" }
ojas-formats = { path = "../ojas-formats" }
serde_json = "1"

[dev-dependencies]
ojas-tokenize = { path = "../ojas-tokenize" }
