[workspace]
resolver = "2"
members = [
    # === engine ===
    "crates/ojas-core",
    "crates/ojas-cli",
    "crates/ojas-formats",
    "crates/ojas-arch",
    "crates/ojas-metal",
    "crates/ojas-train",
    "crates/ojas-swarm",
    "crates/ojas-swarm-proto",
    "crates/ojas-net",
    "crates/ojas-node",
    "crates/ojas-models",
    "crates/ojas-decision",
    "crates/ojas-cpu",
    "crates/ojas-tokenize",
    "crates/ojas-infer",
    "crates/ojas-grammar",
    "crates/ojas-cuda",
    "crates/ojas-vulkan",
    "crates/ojas-vision",
    "crates/ojas-learn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"
description = "All-Rust inference engine: GGUF language models and ONNX vision models on Metal, CPU, CUDA and Vulkan."
repository = "https://github.com/Ajna-inc/ojas-engine"

[workspace.dependencies]
# --- async runtime ------------------------------------------------------------
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"

# --- http & networking --------------------------------------------------------
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "multipart"], default-features = false }
axum = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Swarm networking (ojas-net / ojas-node). Not "upnp": nodes that need inbound
# reachability get it from the coordinator's relay, which is a data path here.
libp2p = { version = "0.56", features = ["tokio", "quic", "tcp", "dns", "noise", "yamux", "kad", "gossipsub", "request-response", "identify", "autonat", "dcutr", "relay", "mdns", "macros", "ed25519"] }
libp2p-stream = "0.4.0-alpha"

# --- serialization ------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
schemars = "0.8"

# --- utilities ----------------------------------------------------------------
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
ring = "0.17"
keyring = "3"
notify = "7"
globset = "0.4"
rand = "0.9"
regex = "1"
similar = "2"
pulldown-cmark = "0.12"
syntect = "5"
itertools = "0.13"
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"
dirs = "6"
fs2 = "0.4"
html2text = "0.12"
urlencoding = "2"
libc = "0.2"
clap = { version = "4", features = ["derive", "env", "string"] }

rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
sqlparser = "0.49"
calamine = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# The desktop shell now runs the engine IN-PROCESS (ojas-serve is a lib dep, not a
# spawned release binary), so `cargo tauri dev` compiles these crates under the dev
# profile. Optimize the compute-heavy engine crates even in a debug build — without
# this, in-app inference runs at unoptimized speed. The shell/UI-glue crates stay at
# opt-level 0 for fast incremental compiles.
[profile.dev.package.ojas-core]
opt-level = 3
[profile.dev.package.ojas-formats]
opt-level = 3
[profile.dev.package.ojas-tokenize]
opt-level = 3
[profile.dev.package.ojas-metal]
opt-level = 3
[profile.dev.package.ojas-models]
opt-level = 3
[profile.dev.package.ojas-infer]
opt-level = 3
[profile.dev.package.ojas-train]
opt-level = 3
[profile.dev.package.ojas-cpu]
opt-level = 3
[profile.dev.package.ojas-vision]
opt-level = 3
