[package]
name = "ojas-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# For `iq_tables`, which lives in core so both GPU backends can render the same codebooks.
ojas-core = { path = "../ojas-core" }
tracing = { workspace = true }
anyhow = "1"
half = "2"
serde_json = "1"
# `swarm_id`: a GGUF's swarm identity, shared by the engine worker and the node.
ojas-swarm-proto = { path = "../ojas-swarm-proto" }

[target.'cfg(unix)'.dependencies]
# `swarm_id` hashes tensor data through mmap on Unix.
libc = "0.2"

[dev-dependencies]
